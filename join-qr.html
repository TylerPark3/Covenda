    :root { --ink:#1a1a17; --muted:#6b6b66; --line:#e6e4dd; --gold:#a9822f; --gold-deep:#8a6a2f; --paper:#faf9f6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 20px;
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
           color:var(--ink); background:var(--paper); }
    .card { width:100%; max-width:420px; text-align:center; background:#fff; border:1px solid var(--line);
            border-radius:20px; padding:28px 24px 24px; box-shadow:0 20px 50px -30px rgba(0,0,0,.35); }
    .kicker { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-deep); margin:0; }
    h1 { font-size:22px; margin:8px 0 4px; letter-spacing:-.01em; }
    p.sub { margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.5; }
    .qr { width:min(280px,72vw); height:auto; border:1px solid var(--line); border-radius:14px; padding:14px; background:#fff; }
    .actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
    a.btn { display:block; padding:14px 16px; border-radius:12px; font-size:15px; font-weight:650; text-decoration:none; }
    a.download { background:linear-gradient(96deg,#a9822f,#c9a24b); color:#fff; }
    a.open { border:1px solid var(--line); color:var(--ink); }
    .link { margin-top:16px; font-size:12px; color:var(--muted); word-break:break-all; }
    .hint { margin-top:14px; font-size:12.5px; color:var(--muted); line-height:1.5; }
    @media (prefers-color-scheme: dark) {
      body { background:#14140f; color:#f3f0e6; }
      .card { background:#1c1b15; border-color:#33322a; }
      .qr { background:#fff; }
      a.open { border-color:#33322a; color:#f3f0e6; }
    }
  </style>
