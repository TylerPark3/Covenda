<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Project brief · Covenda operator</title>
  <link rel="stylesheet" href="/workflow.css">
</head>
<body data-operator-page="project">
  <header class="workflow-header">
    <a class="workflow-brand" href="/admin.html"><img src="/assets/covenda-mark.svg" alt="">Covenda operator</a>
    <nav aria-label="Operator navigation"><a href="/operator/intakes">Company intakes</a><a href="/admin.html">Submission inbox</a><button class="button secondary" id="operatorSignout" type="button">Sign out</button></nav>
  </header>
  <main>
    <section class="login-shell" id="operatorLogin">
      <h1>Operator sign in.</h1>
      <p>This route contains private company and project information.</p>
      <form id="operatorLoginForm">
        <label class="field"><span>Operator email</span><input name="email" type="email" autocomplete="email" required></label>
        <button class="button primary" type="submit">Email me a sign-in link</button>
        <p id="operatorLoginMessage" class="alert" aria-live="polite" hidden></p>
      </form>
    </section>
    <div class="workflow-page" id="operatorContent" hidden>
      <div class="loading">Loading project…</div>
    </div>
  </main>
  <script type="module" src="/operator/operator-workflow.js"></script>
</body>
</html>
